name: (R) Validate Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Git tag to validate. (sample 1.0.0 or v1.0.0)"
        required: true
        type: string
      allowed-branches:
        description: "Branches that can release in addition to the default branch. One GitHub branch filter pattern per line: * does not match /, ** does. Tags are never allowed."
        required: false
        type: string
        default: ""
    outputs:
      tag:
        description: "Original Git tag, including its optional v prefix."
        value: ${{ jobs.validate-release.outputs.tag }}
      version:
        description: "Version with the optional leading v removed."
        value: ${{ jobs.validate-release.outputs.version }}

jobs:
  validate-release:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      # Only the validator is needed; do not check out or execute caller code.
      # In this repository, test the current source instead of the main binary.
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          repository: Cysharp/Actions
          ref: ${{ github.repository == 'Cysharp/Actions' && github.sha || 'main' }}

      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: 9.0.x

      # workflow_dispatch can start from any branch or tag, and create-release tags that commit.
      # In a reusable workflow, github.* is the caller's context.
      # This repository's pull_request runs test this workflow on refs/pull/*/merge and release nothing.
      - name: Validate release ref
        if: ${{ !(github.repository == 'Cysharp/Actions' && github.event_name == 'pull_request') }}
        shell: bash
        run: |
          args=(validate-release-ref --ref "$GIT_REF" --ref-type "$GIT_REF_TYPE" --default-branch "$DEFAULT_BRANCH" --allowed-branches "$ALLOWED_BRANCHES")
          if [[ "$GH_REPO" == "Cysharp/Actions" ]]; then
            dotnet run --project ./src/CysharpActions/CysharpActions.csproj --no-launch-profile -- "${args[@]}"
          else
            binary="./actions/Linux-${RUNNER_ARCH}/CysharpActions"
            chmod +x "$binary"
            "$binary" "${args[@]}"
          fi
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOWED_BRANCHES: ${{ inputs.allowed-branches }}
          GH_REPO: ${{ github.repository }}

      - name: Validate and normalize tag
        id: validate
        shell: bash
        run: |
          if [[ "$GH_REPO" == "Cysharp/Actions" ]]; then
            dotnet run --project ./src/CysharpActions/CysharpActions.csproj --no-launch-profile -- \
              validate-release --tag "$TAG"
          else
            binary="./actions/Linux-${RUNNER_ARCH}/CysharpActions"
            chmod +x "$binary"
            "$binary" validate-release --tag "$TAG"
          fi
        env:
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
