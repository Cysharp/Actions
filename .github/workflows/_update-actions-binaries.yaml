name: Update Actions binaries

# add or update actions binaries and commit

on:
  release:
    types: [published]
  workflow_dispatch: # for debug usage
    inputs:
      tag:
        description: "Released tag"
        required: true
        default: ""

jobs:
  build:
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Load secrets
        id: op-load-secret
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_PUBLIC }}
          ACTIONBOT_PRIVATE_KEY: "op://${{ vars.OP_VAULT_ACTIONS_PUBLIC }}/GITHUB_ACTIONS_BOT/private key"
          ACTIONBOT_APPID: "op://${{ vars.OP_VAULT_ACTIONS_PUBLIC }}/GITHUB_ACTIONS_BOT/appid"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ steps.op-load-secret.outputs.ACTIONBOT_APPID }}
          private-key: ${{ steps.op-load-secret.outputs.ACTIONBOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: 9.0.x
      - name: dotnet publish (x64)
        run: dotnet publish ./src/CysharpActions -c Release --runtime linux-x64 -o ./actions/Linux-X64 -p:Version="${VERSION}"
      - name: dotnet publish (arm64)
        run: dotnet publish ./src/CysharpActions -c Release --runtime linux-arm64 -o ./actions/Linux-ARM64 -p:Version="${VERSION}"
      - name: Smoke test generated x64 binary
        run: |
          chmod +x ./actions/Linux-X64/CysharpActions
          ./actions/Linux-X64/CysharpActions --help | grep -Fq "update-version"
          ./actions/Linux-X64/CysharpActions update-version --help | grep -Fq -- "--additional-commit-path-string"
          output_file="${RUNNER_TEMP}/generated-binary-output.txt"
          GITHUB_OUTPUT="${output_file}" ./actions/Linux-X64/CysharpActions increment-version --version 1.2.3 --type patch
          grep -Fxq "version=1.2.4" "${output_file}"
      - name: Validate generated architectures
        run: |
          file ./actions/Linux-X64/CysharpActions
          file ./actions/Linux-ARM64/CysharpActions
          readelf -h ./actions/Linux-X64/CysharpActions | grep -Eq "Machine:.*(Advanced Micro Devices X86-64|X86-64)"
          readelf -h ./actions/Linux-ARM64/CysharpActions | grep -Eq "Machine:.*AArch64"
      - name: list files
        run: ls -lR ./actions/
      - name: Check update on git
        id: check_update
        run: git diff --exit-code -- ./actions || echo "changed=1" | tee -a "$GITHUB_OUTPUT"
      - name: Commit and push files (add/updated? = ${{ steps.check_update.outputs.changed == '1' }})
        if: ${{ steps.check_update.outputs.changed == '1' }}
        id: update
        run: |
          git remote set-url origin "https://github-actions:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A -- ./actions
          git commit -m "[automate] New CysharpActions.exe committed" -m "Commit by [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" -- ./actions

          git push origin "${BRANCH_NAME}"
          echo "commited=1" | tee -a "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
