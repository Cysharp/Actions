name: (R) Create Release

on:
  workflow_dispatch:
    inputs:
      commit-id:
        description: "commit-id: CommitId to create release & tag."
        required: false
        type: string
      dry-run:
        description: "dry-run: true = create a draft and upload requested assets, then clean up resources created by this run."
        required: true
        type: boolean
      require-validation:
        description: "require-validation: true require validation must pass, false to keep going even validation failed."
        required: false
        type: boolean
        default: true
      tag:
        description: "tag: Git tag to create. (sample 1.0.0)"
        required: true
        type: string
      # nuget (DEPRECATED due to https://github.com/NuGet/login/issues/6)
      nuget-path:
        description: "nuget path to upload. (DEPRECATED)"
        required: false
        type: string
        default: |
          ./nuget/*.nupkg
          ./nuget/*.snupkg
      nuget-push:
        description: "nuget-push: true = upload nuget package. false = not upload (DEPRECATED, write your own NUGET Trusted publish step in your workflow instead.)"
        required: false
        type: boolean
        default: false
      # release
      release-asset-path:
        description: "release assets path to upload. This is a list of paths separated by a newline."
        required: false
        type: string
      release-format: # see: https://docs.github.com/en/actions/learn-github-actions/expressions#format
        description: "release-format: if 'Ver.{0}' is specified, the release title will be 'Ver.1.0.0'. set '{0}' if no prefix is preferred."
        required: false
        type: string
        default: "v{0}"
      release-upload:
        description: "release-upload: true = upload assets. false = not upload"
        required: false
        type: boolean
        default: false
      download-run-id:
        description: "Run ID to download artifacts from. If not specified, downloads from the current run."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      commit-id:
        description: "CommitId to create release & tag."
        required: true
        type: string
      dry-run:
        description: "true = create a draft and upload requested assets, then clean up resources created by this run."
        required: true
        type: boolean
      require-validation:
        description: "true require validation must pass, false to keep going even validation failed."
        required: false
        type: boolean
        default: true
      tag:
        description: "Git tag to create. (sample 1.0.0)"
        required: true
        type: string
      # nuget (DEPRECATED due to https://github.com/NuGet/login/issues/6)
      nuget-path:
        description: "nuget path to upload. (DEPRECATED)"
        required: false
        type: string
        default: |
          ./nuget/*.nupkg
          ./nuget/*.snupkg
      nuget-push:
        description: "nuget-push: true = upload nuget package. false = not upload (DEPRECATED, write your own NUGET Trusted publish step in your workflow instead.)"
        required: false
        type: boolean
        default: false
      # release
      release-asset-path:
        description: "release assets path to upload. This is a list of paths separated by a newline."
        required: false
        type: string
      release-format: # see: https://docs.github.com/en/actions/learn-github-actions/expressions#format
        description: "Release format. (if 'Ver.{0}' is specified, the release title will be 'Ver.1.0.0'. set '{0}' if no prefix is preferred.)"
        required: false
        type: string
        default: "v{0}"
      release-upload:
        description: "true = upload assets. false = not upload"
        required: false
        type: boolean
        default: false
      download-run-id:
        description: "Run ID to download artifacts from. If not specified, downloads from the current run."
        required: false
        type: string
        default: ""

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    name: Create Release
    permissions:
      contents: write # required for creating release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate inputs - unitypackage
        shell: bash
        if: ${{ inputs.release-upload && inputs.release-asset-path == '' }}
        run: |
          echo "Validation error! 'inputs.release-asset-path' cannot be blank when 'inputs.release-upload' is true."
          exit 1

      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          ref: ${{ inputs.commit-id }}
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: 9.0.x
      - name: Set Cysharp/Actions binary path
        id: actions-caller
        run: |
          branch=main
          if [[ -f "${{ github.workspace }}/../../_actions/Cysharp/Actions/${branch}/actions/Linux-${{ runner.arch }}/CysharpActions" ]]; then
            echo path="${{ github.workspace }}/../../_actions/Cysharp/Actions/${branch}/actions/Linux-${{ runner.arch }}/CysharpActions" | tee -a "$GITHUB_OUTPUT"
            chmod +x "${{ github.workspace }}/../../_actions/Cysharp/Actions/${branch}/actions/Linux-${{ runner.arch }}/CysharpActions"
          else
            echo path="dotnet run --project ./src/CysharpActions/CysharpActions.csproj --no-launch-profile --" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Prepare ownership journal path
        id: release-state
        shell: bash
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/create-release.XXXXXX")
          echo "path=$directory/release-state.json" >> "$GITHUB_OUTPUT"

      # validate
      - name: Validate and normalize tag
        id: validate
        run: |
          extra_args=""
          if [[ "${REQUIRE_VALIDATION}" == "true" ]]; then
            extra_args="--require-validation"
          fi
          ${{ steps.actions-caller.outputs.path }} validate-tag --tag "${TAG}" ${extra_args}
        env:
          TAG: ${{ inputs.tag }}
          REQUIRE_VALIDATION: ${{ inputs.require-validation }}
      # Download(All) Artifacts to current directory
      - uses: Cysharp/Actions/.github/actions/download-artifact@main
        with:
          run-id: ${{ inputs.download-run-id || github.run_id }}
      - name: Show download aritifacts
        run: ls -lR
      - name: Validate package exists in artifact - release assets
        if: ${{ inputs.release-upload }}
        run: '${{ steps.actions-caller.outputs.path }} validate-file-exists --path-pattern-string "$RELEASE_ASSET_PATH"'
        env:
          RELEASE_ASSET_PATH: ${{ inputs.release-asset-path }}
      # Create Releases
      - name: Create Release
        run: '${{ steps.actions-caller.outputs.path }} prepare-release --tag "$TAG" --release-title "$RELEASE_TITLE" --state-path "$STATE_PATH" --release-asset-path-string "$RELEASE_ASSET_PATH"'
        env:
          STATE_PATH: ${{ steps.release-state.outputs.path }}
          TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ format(inputs.release-format, inputs.tag) }}
          RELEASE_ASSET_PATH: ${{ inputs.release-upload && inputs.release-asset-path || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # Never infer ownership from a matching tag or draft release listing.
      - name: Clean up resources created by this run
        if: ${{ always() && (inputs.dry-run || failure() || cancelled()) }}
        shell: bash
        run: |
          if [[ -n "$STATE_PATH" && -f "$STATE_PATH" ]]; then
            ${{ steps.actions-caller.outputs.path }} cleanup-release --state-path "$STATE_PATH"
          fi
        env:
          STATE_PATH: ${{ steps.release-state.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
